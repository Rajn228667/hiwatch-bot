services:
  - type: web
    name: hiwatch-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAMES
        value: STPierce,Who_Knyaz
      - key: ADMIN_CHAT_IDS
        value: 1930108146,1418146556
      - key: HIKMART_API_URL
        value: https://hikmart.vercel.app
      - key: HIKMART_BOT_TOKEN
        value: hikmart-bot-sync-2025
      - key: WEBHOOK_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true
