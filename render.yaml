services:
  - type: web
    name: hiwatch-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAMES
        value: STPierce,who_knyaz
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-3-mini
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
